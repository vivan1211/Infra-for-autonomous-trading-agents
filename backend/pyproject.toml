[project]
name = "prediction-market-agents-backend"
version = "0.1.0"
description = "Agent Fund — AI Prediction Market Portfolio Manager Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.30.0",
    "httpx~=0.27.0",
    "cryptography~=43.0.0",
    "pydantic~=2.9.0",
    "pydantic-settings~=2.5.0",
    "python-multipart~=0.0.12",
    "websockets~=13.0",
    "openai~=1.50.0",
    "anthropic~=0.37.0",
    "asyncpg~=0.30.0",
    "sentry-sdk[fastapi]~=2.0.0",
    "PyJWT~=2.8.0",
    "arq~=0.26.0",
    "redis~=5.0.0",
    "slowapi~=0.1.9",
    "apscheduler~=3.10",
    "tweepy~=4.14.0",
    "Pillow>=10.0",
    "google-auth~=2.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "kalshi", "bot_runner", "polymarket", "twitter_poster"]
